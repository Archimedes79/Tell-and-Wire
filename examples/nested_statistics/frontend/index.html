<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested statistics</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  fieldset { border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: .4rem; margin: 1rem 0; }
  legend { font-weight: 600; }
  label { display: block; font-weight: 600; margin-top: .5rem; }
  textarea, input { width: 100%; box-sizing: border-box; font: inherit; padding: .4rem; }
  textarea { min-height: 7rem; }
  button { font: inherit; padding: .4rem 1rem; margin: 1rem .5rem 0 0; cursor: pointer; }
  #status { color: GrayText; min-height: 1.5em; margin-top: 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 .25rem; }
  pre { margin: 0; padding: .75rem; overflow: auto; white-space: pre-wrap;
        background: color-mix(in srgb, CanvasText 6%, Canvas); border-radius: .4rem; }
</style>
</head>
<body>
<!--
  A page written by hand, beside the project's flow.json: frontend/index.html.
  A served project shows it in place of the built page, and a bundle carries it.

  It knows nothing of the graph but the names the runtime API gives it, and
  calls nothing else:

    GET  /api/runtime/interface   its start points -- each with what the graph reads
                                  of what it is sent -- and its end points, by name
    GET  /api/runtime/stream      what happens: every round, and the session after it
    POST /api/runtime/rounds      { event, values }: start a round at a start point
    POST /api/runtime/reset       forget what using the graph left behind

  So it would draw a form for any graph. This one measures a paragraph.
-->
<h1 id="name">…</h1>
<p id="description"></p>
<form id="events"></form>
<button id="over" type="button" title="Forget what using the graph left behind">Start over</button>
<div id="status"></div>
<div id="outputs"></div>

<script type="module">
  /** One call of the runtime API: a GET, or a POST of *body*; its refusal is its own words. */
  const api = async (route, body) => {
    const response = await fetch(`/api/runtime/${route}`, body === undefined ? undefined : {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const answer = await response.json();
    if (!response.ok) throw new Error(answer.detail);
    return answer;
  };

  const say = (text) => { document.getElementById('status').textContent = text; };
  const shown = (value) => (value === undefined ? '—' : typeof value === 'string' ? value : JSON.stringify(value, null, 2));
  const element = (tag, properties = {}) => Object.assign(document.createElement(tag), properties);
  /** *values* with *value* put at the dotted *path*: "file.content" inside "file". */
  const put = (values, path, value) => {
    const keys = path.split('.');
    let inner = values;
    for (const key of keys.slice(0, -1)) inner = inner[key] ??= {};
    inner[keys.at(-1)] = value;
    return values;
  };
  /** What *values* hold at the dotted *path*. */
  const at = (values, path) => path.split('.').reduce((inner, key) => (inner && typeof inner === 'object' ? inner[key] : undefined), values);

  const graph = await api('interface');
  document.title = graph.name;
  document.getElementById('name').textContent = graph.name;
  document.getElementById('description').textContent = graph.description;

  // For every start point, a field for every part of what it is sent that the
  // graph reads -- a number on a line, anything else in a box -- and a button
  // that starts it with them. A graph that has none runs whole, sent nothing.
  const fields = [];
  const start = async (event) => {
    const values = {};
    for (const field of fields.filter((one) => one.event === event)) {
      put(values, field.path, field.number ? Number(field.input.value) : field.input.value);
    }
    try {
      await api('rounds', { session: graph.session, event, values });
    } catch (error) {
      say(error.message);
    }
  };
  const form = document.getElementById('events');
  for (const event of graph.events) {
    const set = element('fieldset');
    set.append(element('legend', { textContent: event.label }));
    for (const read of event.reads ?? []) {
      const number = read.type === 'number';
      const input = element(number ? 'input' : 'textarea', { id: `${event.name}-${read.name}`, ...(number ? { type: 'number' } : {}) });
      fields.push({ event: event.name, path: read.name, number, input });
      set.append(element('label', { htmlFor: input.id, textContent: read.label }), input);
    }
    set.append(element('button', { type: 'button', textContent: event.label, onclick: () => start(event.name) }));
    form.append(set);
  }
  if (!graph.events.length) form.append(element('button', { type: 'button', textContent: 'Run', onclick: () => start(null) }));
  document.getElementById('over').onclick = () => api('reset', { session: graph.session }).catch((error) => say(error.message));

  // A place for every output the graph hands back.
  const outputs = new Map();
  for (const output of graph.outputs) {
    const pre = element('pre', { textContent: '—' });
    outputs.set(output.name, pre);
    document.getElementById('outputs').append(element('h2', { textContent: output.label }), pre);
  }

  // What happens, as it happens -- this page's rounds, a clock's, another tab's.
  const stream = new EventSource(`/api/runtime/stream?session=${encodeURIComponent(graph.session)}`);
  stream.addEventListener('session', ({ data }) => {
    const session = JSON.parse(data);
    // What each start point was sent last -- its design's, until it is sent something.
    for (const { event, path, input } of fields) {
      if (document.activeElement !== input) input.value = shown(at(session.sent[event], path)).replace(/^—$/, '');
    }
    for (const [name, pre] of outputs) pre.textContent = shown(session.outputs[name]);
    // Started over: nothing has run, so nothing is to be said about the last round.
    if (!session.rounds && !session.round) say('');
  });
  stream.addEventListener('round', ({ data }) => {
    const round = JSON.parse(data);
    if (round.done) say(round.error ? `Failed: ${round.error}` : round.cancelled ? 'Stopped.' : 'Done.');
    else if (round.current_label) say(`${round.current_label}… (${round.completed} of ${round.total})`);
    else say(`Running… (${round.completed} of ${round.total})`);
  });
  stream.onerror = () => say('The tool is not answering. Is it still running?');
</script>
</body>
</html>
