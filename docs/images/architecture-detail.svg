.c-gray{fill:#444441;stroke:#B4B2A9}g.c-gray>.th{fill:#D3D1C7}g.c-gray>.ts{fill:#B4B2A9}
}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect class="c-purple" x="40" y="20" width="293" height="396" rx="12" stroke-width="0.5"/><text class="th" x="54" y="38" text-anchor="start" dominant-baseline="central">Editor</text><text class="ts" x="326" y="38" text-anchor="end" dominant-baseline="central">one server, :8000</text></g><g class="c-teal"><rect class="c-teal" x="347" y="20" width="293" height="396" rx="12" stroke-width="0.5"/><text class="th" x="361" y="38" text-anchor="start" dominant-baseline="central">Notebook</text><text class="ts" x="633" y="38" text-anchor="end" dominant-baseline="central">own server, :8100</text></g><rect class="box" x="50" y="52" width="273" height="47" rx="4" stroke-width="0.5"/><text class="th" x="60" y="66" text-anchor="start" dominant-baseline="central">GUI editor</text><text class="ts" x="60" y="85" text-anchor="start" dominant-baseline="central">frontend/editor/gui/  designer</text><rect class="box" x="50" y="107" width="273" height="47" rx="4" stroke-width="0.5"/><text class="th" x="60" y="121" text-anchor="start" dominant-baseline="central">Graph editor</text><text class="ts" x="60" y="140" text-anchor="start" dominant-baseline="central">frontend/editor/graph/  canvas</text><rect class="box" x="50" y="162" width="273" height="47" rx="4" stroke-width="0.5"/><text class="th" x="60" y="176" text-anchor="start" dominant-baseline="central">Shell of both</text><text class="ts" x="60" y="195" text-anchor="start" dominant-baseline="central">frontend/editor/{app,document,api}/</text><rect class="box" x="50" y="217" width="273" height="98" rx="4" stroke-width="0.5"/><text class="th" x="60" y="231" text-anchor="start" dominant-baseline="central">Editor backend</text><text class="ts" x="60" y="250" text-anchor="start" dominant-baseline="central">backend/editor/project/  packs</text><text class="ts" x="60" y="267" text-anchor="start" dominant-baseline="central">backend/editor/graph/  AI writing</text><text class="ts" x="60" y="284" text-anchor="start" dominant-baseline="central">backend/editor/runtime/  setup</text><text class="ts" x="60" y="301" text-anchor="start" dominant-baseline="central">backend/editor/host/  routes</text><rect class="box" x="50" y="323" width="273" height="81" rx="4" stroke-width="0.5"/><text class="th" x="60" y="337" text-anchor="start" dominant-baseline="central">Editor part of the definitions</text><text class="ts" x="60" y="356" text-anchor="start" dominant-baseline="central">graph/editor/  prompts, pull, table</text><text class="ts" x="60" y="373" text-anchor="start" dominant-baseline="central">gui/editor/  a whole GUI, written</text><text class="ts" x="60" y="390" text-anchor="start" dominant-baseline="central">neutral: browser and Node share it</text><rect class="box" x="357" y="52" width="273" height="47" rx="4" stroke-width="0.5"/><text class="th" x="367" y="66" text-anchor="start" dominant-baseline="central">Page</text><text class="ts" x="367" y="85" text-anchor="start" dominant-baseline="central">frontend/gui-notebook/  page, windows</text><rect class="box" x="357" y="107" width="273" height="47" rx="4" stroke-width="0.5"/><text class="th" x="367" y="121" text-anchor="start" dominant-baseline="central">Cells</text><text class="ts" x="367" y="140" text-anchor="start" dominant-baseline="central">frontend/graph-notebook/  cells</text><rect class="box" x="357" y="162" width="273" height="47" rx="4" stroke-width="0.5"/><text class="th" x="367" y="176" text-anchor="start" dominant-baseline="central">Shell of both</text><text class="ts" x="367" y="195" text-anchor="start" dominant-baseline="central">frontend/notebook/{document,elements}/</text><rect class="box" x="357" y="217" width="273" height="98" rx="4" stroke-width="0.5"/><text class="th" x="367" y="231" text-anchor="start" dominant-baseline="central">Notebook backend</text><text class="ts" x="367" y="250" text-anchor="start" dominant-baseline="central">backend/notebook/main.ts  start</text><text class="ts" x="367" y="267" text-anchor="start" dominant-baseline="central">api.ts, routes.ts  open, save, hold</text><text class="ts" x="367" y="284" text-anchor="start" dominant-baseline="central">describe.ts  windows from a sentence</text><text class="ts" x="367" y="301" text-anchor="start" dominant-baseline="central">files.ts  older projects</text><rect class="box" x="357" y="323" width="273" height="81" rx="4" stroke-width="0.5"/><text class="th" x="367" y="337" text-anchor="start" dominant-baseline="central">Its model: windows and page</text><text class="ts" x="367" y="356" text-anchor="start" dominant-baseline="central">gui/notebook/windows.ts, fromGraph.ts</text><text class="ts" x="367" y="373" text-anchor="start" dominant-baseline="central">page.ts, pageModel.ts, read.ts, edit.ts</text><text class="ts" x="367" y="390" text-anchor="start" dominant-baseline="central">neutral: browser and Node share it</text><rect class="box" x="140" y="428" width="400" height="30" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="340" y="443" text-anchor="middle" dominant-baseline="central">know each other only by /api/product, /api/switch, ?open=</text><line x1="190" y1="416" x2="190" y2="428" stroke="#73726c" stroke-width="0.5"/><line x1="490" y1="416" x2="490" y2="428" stroke="#73726c" stroke-width="0.5"/><line x1="90" y1="416" x2="90" y2="482" class="arr" marker-end="url(#arrow)"/><line x1="590" y1="416" x2="590" y2="482" class="arr" marker-end="url(#arrow)"/><text class="ts" x="98" y="462" text-anchor="start" dominant-baseline="central">import</text><text class="ts" x="582" y="462" text-anchor="end" dominant-baseline="central">import</text><g class="c-gray"><rect class="c-gray" x="40" y="482" width="600" height="202" rx="12" stroke-width="0.5"/><text class="th" x="54" y="500" text-anchor="start" dominant-baseline="central">Common code</text><text class="ts" x="626" y="500" text-anchor="end" dominant-baseline="central">imports neither product</text></g><rect class="box" x="52" y="516" width="186" height="81" rx="4" stroke-width="0.5"/><text class="th" x="62" y="530" text-anchor="start" dominant-baseline="central">Graph definition</text><text class="ts" x="62" y="549" text-anchor="start" dominant-baseline="central">graph/  format, wiring</text><text class="ts" x="62" y="566" text-anchor="start" dominant-baseline="central">graph/files/  formats</text><text class="ts" x="62" y="583" text-anchor="start" dominant-baseline="central">graph/nodes/  node kinds</text><rect class="box" x="250" y="516" width="186" height="81" rx="4" stroke-width="0.5"/><text class="th" x="260" y="530" text-anchor="start" dominant-baseline="central">GUI definition</text><text class="ts" x="260" y="549" text-anchor="start" dominant-baseline="central">gui/  blocks, grid size</text><text class="ts" x="260" y="566" text-anchor="start" dominant-baseline="central">gui/widgets/  block kinds</text><text class="ts" x="260" y="583" text-anchor="start" dominant-baseline="central">gui/windows/  grid, order</text><rect class="box" x="448" y="516" width="186" height="81" rx="4" stroke-width="0.5"/><text class="th" x="458" y="530" text-anchor="start" dominant-baseline="central">Authoring</text><text class="ts" x="458" y="549" text-anchor="start" dominant-baseline="central">graph/authoring/  design</text><text class="ts" x="458" y="566" text-anchor="start" dominant-baseline="central">gui/authoring/  check</text><text class="ts" x="458" y="583" text-anchor="start" dominant-baseline="central">backend/authoring/  save</text><rect class="box" x="52" y="605" width="186" height="64" rx="4" stroke-width="0.5"/><text class="th" x="62" y="619" text-anchor="start" dominant-baseline="central">Start-up</text><text class="ts" x="62" y="638" text-anchor="start" dominant-baseline="central">backend/cli/</text><text class="ts" x="62" y="655" text-anchor="start" dominant-baseline="central">main.ts, cli.ts</text><rect class="box" x="250" y="605" width="186" height="64" rx="4" stroke-width="0.5"/><text class="th" x="260" y="619" text-anchor="start" dominant-baseline="central">Structure</text><text class="ts" x="260" y="638" text-anchor="start" dominant-baseline="central">backend/architecture/</text><text class="ts" x="260" y="655" text-anchor="start" dominant-baseline="central">the rules, as tests</text><rect class="box" x="448" y="605" width="186" height="64" rx="4" stroke-width="0.5"/><text class="th" x="458" y="619" text-anchor="start" dominant-baseline="central">Host and runtime</text><text class="ts" x="458" y="638" text-anchor="start" dominant-baseline="central">backend/deployment/</text><text class="ts" x="458" y="655" text-anchor="start" dominant-baseline="central">in the next block</text><line x1="340" y1="684" x2="340" y2="714" class="arr" marker-end="url(#arrow)"/><text class="ts" x="350" y="700" text-anchor="start" dominant-baseline="central">runs</text><g class="c-coral"><rect class="c-coral" x="40" y="714" width="600" height="232" rx="12" stroke-width="0.5"/><text class="th" x="54" y="732" text-anchor="start" dominant-baseline="central">Use: what a package carries</text><text class="ts" x="626" y="732" text-anchor="end" dominant-baseline="central">editor and notebook run on it</text></g><rect class="box" x="52" y="748" width="282" height="81" rx="4" stroke-width="0.5"/><text class="th" x="62" y="762" text-anchor="start" dominant-baseline="central">Browser</text><text class="ts" x="62" y="781" text-anchor="start" dominant-baseline="central">frontend/deployment/gui/  kit, views</text><text class="ts" x="62" y="798" text-anchor="start" dominant-baseline="central">frontend/deployment/windows/  framed</text><text class="ts" x="62" y="815" text-anchor="start" dominant-baseline="central">loads no editor code (tested)</text><rect class="box" x="346" y="748" width="282" height="81" rx="4" stroke-width="0.5"/><text class="th" x="356" y="762" text-anchor="start" dominant-baseline="central">Session host</text><text class="ts" x="356" y="781" text-anchor="start" dominant-baseline="central">backend/deployment/host/  rounds</text><text class="ts" x="356" y="798" text-anchor="start" dominant-baseline="central">backend/deployment/gui/  hooks</text><text class="ts" x="356" y="815" text-anchor="start" dominant-baseline="central">backend/deployment/project/  folder</text><rect class="box" x="52" y="837" width="282" height="98" rx="4" stroke-width="0.5"/><text class="th" x="62" y="851" text-anchor="start" dominant-baseline="central">Graph execution engine</text><text class="ts" x="62" y="870" text-anchor="start" dominant-baseline="central">backend/deployment/runtime/</text><text class="ts" x="62" y="887" text-anchor="start" dominant-baseline="central">executor, latch, reuse, clock</text><text class="ts" x="62" y="904" text-anchor="start" dominant-baseline="central">nodes/  the runner of each node kind</text><text class="ts" x="62" y="921" text-anchor="start" dominant-baseline="central">protocol, localCore, stdio, sandbox</text><rect class="box" x="346" y="837" width="282" height="98" rx="4" stroke-width="0.5"/><text class="th" x="356" y="851" text-anchor="start" dominant-baseline="central">AI at run time</text><text class="ts" x="356" y="870" text-anchor="start" dominant-baseline="central">backend/deployment/runtime/ai/</text><text class="ts" x="356" y="887" text-anchor="start" dominant-baseline="central">the model client and its settings</text><text class="ts" x="356" y="904" text-anchor="start" dominant-baseline="central">mcp/  tool servers an AI node calls</text><text class="ts" x="356" y="921" text-anchor="start" dominant-baseline="central">mcp/web/, mcp/documents/  optional</text><line x1="340" y1="946" x2="340" y2="976" class="arr" marker-end="url(#arrow)"/><text class="ts" x="350" y="962" text-anchor="start" dominant-baseline="central">reads and writes</text><g class="c-gray"><rect class="c-gray" x="40" y="976" width="600" height="112" rx="12" stroke-width="0.5"/><text class="th" x="54" y="994" text-anchor="start" dominant-baseline="central">The project: plain files, one folder per tool</text><text class="ts" x="54" y="1020" text-anchor="start" dominant-baseline="central">gui.json, graph-flow.json, graph-nodes.json, graph-schedule.json</text><text class="ts" x="54" y="1037" text-anchor="start" dominant-baseline="central">nodes/&lt;id&gt;/  input.js, output.js, code.js or prompt.md</text><text class="ts" x="54" y="1054" text-anchor="start" dominant-baseline="central">examples/, notebook-examples/  projects that tests and CI run</text><text class="ts" x="54" y="1072" text-anchor="start" dominant-baseline="central">beside the blocks: scripts/ (launchers, packaging), docs/, frontend/test/</text></g></svg>
