<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 1112" role="img"><title>Architecture of Tell and Wire by code directory</title><desc>Two products, the editor and the notebook, stand on common code; the common deployment block runs a tool; both read and write plain project files.</desc><style>svg{font-family:Segoe UI,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f1e1d}.ts{font-size:12px;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#1f1e1d}
.box{fill:#ffffff;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-purple{fill:#EEEDFE;stroke:#534AB7}g.c-purple>.th{fill:#3C3489}g.c-purple>.ts{fill:#534AB7}
.c-teal{fill:#E1F5EE;stroke:#0F6E56}g.c-teal>.th{fill:#085041}g.c-teal>.ts{fill:#0F6E56}
.c-coral{fill:#FAECE7;stroke:#993C1D}g.c-coral>.th{fill:#712B13}g.c-coral>.ts{fill:#993C1D}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}g.c-gray>.th{fill:#444441}g.c-gray>.ts{fill:#5F5E5A}
@media (prefers-color-scheme:dark){.t,.th{fill:#e8e6dc}.ts{fill:#b4b2a9}.box{fill:#262624;stroke:#73726c}.arr{stroke:#b4b2a9}
.c-purple{fill:#3C3489;stroke:#AFA9EC}g.c-purple>.th{fill:#CECBF6}g.c-purple>.ts{fill:#AFA9EC}
