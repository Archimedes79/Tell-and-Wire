<svg xmlns="http://www.w3.org/2000/svg" width="936" viewBox="0 0 936 1302" role="img">
<title>The tool servers and the root: mcp/, scripts/, start and stop files</title>
<desc>mcp/ are the tool servers that come with it, each a program of its own; the root holds how everything is started, built and packaged. 41 rows: each file with what it does.</desc>
<style>svg{font-family:Segoe UI,Helvetica,Arial,sans-serif}.bg{fill:#ffffff}.h{font-size:19px;font-weight:600;fill:#1f1e1d}.n{font-size:12.5px;fill:#5f5e5a}.d{font-size:13px;font-weight:600;fill:#633806}.f{font-family:Consolas,Menlo,monospace;font-size:11.5px;font-weight:600;fill:#1f1e1d}.r{font-size:11px;fill:#5f5e5a}.box{fill:#FAEEDA;stroke:#854F0B;stroke-width:.6}.row{stroke:#854F0B;stroke-opacity:.25}@media (prefers-color-scheme:dark){.bg{fill:#1c1c1a}.h,.f{fill:#e8e6dc}.n,.r{fill:#b4b2a9}.d{fill:#FAC775}.box{fill:#262624;stroke:#EF9F27}.row{stroke:#EF9F27}}</style>
<rect class="bg" width="936" height="1302"/>
<text class="h" x="20" y="34">The tool servers and the root: mcp/, scripts/, start and stop files</text>
<text class="n" x="20" y="54">mcp/ are the tool servers that come with it, each a program of its own; the root holds how everything is started, built and packaged. (41 rows)</text>
<g>
<rect class="box" x="20" y="78" width="440" height="254" rx="9"/>
<text class="d" x="34" y="100">(root)/</text>
<text class="f" x="34" y="125">.eslintrc.node.cjs</text>
<text class="r" x="42" y="139.5">The lint rules of graph/, gui/ and backend/ (npm run lint); the page has its own,</text>
<text class="r" x="42" y="154">frontend/.eslintrc.cjs.</text>
<line class="row" x1="34" x2="446" y1="160.5" y2="160.5"/>
<text class="f" x="34" y="176.5">start-notebook.cmd, start-notebook.ps1, start-notebook.sh</text>
<text class="r" x="42" y="191">Start the notebook (:8100), the same way (scripts/start-notebook.mjs).</text>
<line class="row" x1="34" x2="446" y1="197.5" y2="197.5"/>
<text class="f" x="34" y="213.5">start.cmd, start.ps1, start.sh</text>
<text class="r" x="42" y="228">Start the editor (:8000): install on first use, build what is stale, restart one</text>
<text class="r" x="42" y="242.5">that runs, open the page. All three call scripts/start.mjs.</text>
<line class="row" x1="34" x2="446" y1="249" y2="249"/>
<text class="f" x="34" y="265">stop-notebook.cmd, stop-notebook.ps1, stop-notebook.sh</text>
<text class="r" x="42" y="279.5">Stop the notebook (scripts/stop-notebook.mjs).</text>
<line class="row" x1="34" x2="446" y1="286" y2="286"/>
<text class="f" x="34" y="302">stop.cmd, stop.ps1, stop.sh</text>
<text class="r" x="42" y="316.5">Stop the editor, and only a Tell &amp; Wire server (scripts/stop.mjs).</text>
</g>
<g>
<rect class="box" x="476" y="78" width="440" height="77" rx="9"/>
<text class="d" x="490" y="100">mcp/documents/</text>
<text class="f" x="490" y="125">settings.html</text>
<text class="r" x="498" y="139.5">The settings page this server brings for the editor to show.</text>
</g>
<g>
<rect class="box" x="476" y="171" width="440" height="77" rx="9"/>
<text class="d" x="490" y="193">mcp/documents/scripts/</text>
<text class="f" x="490" y="218">licenses.mjs</text>
<text class="r" x="498" y="232.5">Every package this folder installs, held to the licences it may come under</text>
</g>
<g>
<rect class="box" x="476" y="264" width="440" height="505" rx="9"/>
<text class="d" x="490" y="286">mcp/documents/src/</text>
<text class="f" x="490" y="311">chunk.ts</text>
<text class="r" x="498" y="325.5">A long Markdown text, cut into chunks that each stand on their own</text>
<line class="row" x1="490" x2="902" y1="332" y2="332"/>
<text class="f" x="490" y="348">documents.ts</text>
<text class="r" x="498" y="362.5">Reading a file: find it (inside the folders it was given), take its text out, hand</text>
<text class="r" x="498" y="377">it over in pieces</text>
<line class="row" x1="490" x2="902" y1="383.5" y2="383.5"/>
<text class="f" x="490" y="399.5">docx.ts</text>
<text class="r" x="498" y="414">A Word document's text as Markdown: headings, lists, bold and italic, tables</text>
<line class="row" x1="490" x2="902" y1="420.5" y2="420.5"/>
<text class="f" x="490" y="436.5">errors.ts</text>
<text class="r" x="498" y="451">Something that went wrong in a way worth telling the person, in words they can act</text>
<text class="r" x="498" y="465.5">on</text>
<line class="row" x1="490" x2="902" y1="472" y2="472"/>
<text class="f" x="490" y="488">info.ts</text>
<text class="r" x="498" y="502.5">What this server calls itself</text>
<line class="row" x1="490" x2="902" y1="509" y2="509"/>
<text class="f" x="490" y="525">main.ts</text>
<text class="r" x="498" y="539.5">Starts the server on stdin and stdout, for the folders given as arguments (or</text>
<text class="r" x="498" y="554">listed in TW_DOCS_ROOTS)</text>
<line class="row" x1="490" x2="902" y1="560.5" y2="560.5"/>
<text class="f" x="490" y="576.5">paging.ts</text>
<text class="r" x="498" y="591">A long text in pieces that end where a person would stop.</text>
<line class="row" x1="490" x2="902" y1="597.5" y2="597.5"/>
<text class="f" x="490" y="613.5">pdf.ts</text>
<text class="r" x="498" y="628">The text layer of a PDF, a page at a time</text>
<line class="row" x1="490" x2="902" y1="634.5" y2="634.5"/>
<text class="f" x="490" y="650.5">roots.ts</text>
<text class="r" x="498" y="665">Which files this server may read: those inside the folders it was started with,</text>
<text class="r" x="498" y="679.5">and no others</text>
<line class="row" x1="490" x2="902" y1="686" y2="686"/>
<text class="f" x="490" y="702">server.ts</text>
<text class="r" x="498" y="716.5">The MCP server: read_document and list_documents</text>
<line class="row" x1="490" x2="902" y1="723" y2="723"/>
<text class="f" x="490" y="739">testFiles.ts</text>
<text class="r" x="498" y="753.5">Files for the tests to read, written by hand: a PDF, a Word document, a zip</text>
</g>
<g>
<rect class="box" x="20" y="348" width="440" height="77" rx="9"/>
<text class="d" x="34" y="370">mcp/web/</text>
<text class="f" x="34" y="395">settings.html</text>
<text class="r" x="42" y="409.5">The settings page this server brings for the editor to show.</text>
</g>
<g>
<rect class="box" x="20" y="441" width="440" height="77" rx="9"/>
<text class="d" x="34" y="463">mcp/web/scripts/</text>
<text class="f" x="34" y="488">licenses.mjs</text>
<text class="r" x="42" y="502.5">Every package this folder installs, held to the licences it may come under</text>
</g>
<g>
<rect class="box" x="20" y="534" width="440" height="490.5" rx="9"/>
<text class="d" x="34" y="556">mcp/web/src/</text>
<text class="f" x="34" y="581">chunk.ts</text>
<text class="r" x="42" y="595.5">A long Markdown text, cut into chunks that each stand on their own</text>
<line class="row" x1="34" x2="446" y1="602" y2="602"/>
<text class="f" x="34" y="618">extract.ts</text>
<text class="r" x="42" y="632.5">The readable part of a web page, as Markdown, with what the page says about itself</text>
<line class="row" x1="34" x2="446" y1="639" y2="639"/>
<text class="f" x="34" y="655">info.ts</text>
<text class="r" x="42" y="669.5">What this server calls itself, and the product token a site's robots.txt can name</text>
<line class="row" x1="34" x2="446" y1="676" y2="676"/>
<text class="f" x="34" y="692">ip.ts</text>
<text class="r" x="42" y="706.5">Whether an address is one a public web server can have</text>
<line class="row" x1="34" x2="446" y1="713" y2="713"/>
<text class="f" x="34" y="729">main.ts</text>
<text class="r" x="42" y="743.5">Starts the server on stdin and stdout</text>
<line class="row" x1="34" x2="446" y1="750" y2="750"/>
<text class="f" x="34" y="766">page.ts</text>
<text class="r" x="42" y="780.5">Reading a page: fetch it (politely, and only the public web), take out what is</text>
<text class="r" x="42" y="795">worth reading, hand it over in pieces</text>
<line class="row" x1="34" x2="446" y1="801.5" y2="801.5"/>
<text class="f" x="34" y="817.5">paging.ts</text>
<text class="r" x="42" y="832">A long text in pieces that end where a person would stop.</text>
<line class="row" x1="34" x2="446" y1="838.5" y2="838.5"/>
<text class="f" x="34" y="854.5">robots.ts</text>
<text class="r" x="42" y="869">robots.txt read as RFC 9309 says, so the server reads only what a site allows.</text>
<line class="row" x1="34" x2="446" y1="875.5" y2="875.5"/>
<text class="f" x="34" y="891.5">safeFetch.ts</text>
<text class="r" x="42" y="906">One GET of a public web address, with what a tool that reads other people's pages</text>
<text class="r" x="42" y="920.5">on someone's own machine must not do without</text>
<line class="row" x1="34" x2="446" y1="927" y2="927"/>
<text class="f" x="34" y="943">server.ts</text>
<text class="r" x="42" y="957.5">The MCP server: one tool, read_page</text>
<line class="row" x1="34" x2="446" y1="964" y2="964"/>
<text class="f" x="34" y="980">testServer.ts</text>
<text class="r" x="42" y="994.5">A web server on this machine for the tests to read from -- the one place the</text>
<text class="r" x="42" y="1009">private-address rule is switched off, and only by the test that says so</text>
</g>
<g>
<rect class="box" x="476" y="785" width="440" height="497" rx="9"/>
<text class="d" x="490" y="807">scripts/</text>
<text class="f" x="490" y="832">dev.mjs</text>
<text class="r" x="498" y="846.5">Development: the backend on :8000 and Vite on :3000, in one terminal</text>
<line class="row" x1="490" x2="902" y1="853" y2="853"/>
<text class="f" x="490" y="869">editorProcess.mjs</text>
<text class="r" x="498" y="883.5">The editor as a process on a port: which one it is, and how to stop it</text>
<line class="row" x1="490" x2="902" y1="890" y2="890"/>
<text class="f" x="490" y="906">launch.mjs</text>
<text class="r" x="498" y="920.5">What every product's start file does once: stop the one running on the port,</text>
<text class="r" x="498" y="935">install on first use, build a stale page, start the server, open the browser.</text>
<line class="row" x1="490" x2="902" y1="941.5" y2="941.5"/>
<text class="f" x="490" y="957.5">licenses.mjs</text>
<text class="r" x="498" y="972">Every package this workspace installs, held to the licences it may come under</text>
<line class="row" x1="490" x2="902" y1="978.5" y2="978.5"/>
<text class="f" x="490" y="994.5">package-notebook.mjs</text>
<text class="r" x="498" y="1009">Build the downloadable package of the notebook alone: npm run package:notebook,</text>
<text class="r" x="498" y="1023.5">after npm run build:notebook</text>
<line class="row" x1="490" x2="902" y1="1030" y2="1030"/>
<text class="f" x="490" y="1046">package.mjs</text>
<text class="r" x="498" y="1060.5">Build the downloadable package: Tell &amp; Wire, ready to run, nothing to install</text>
<line class="row" x1="490" x2="902" y1="1067" y2="1067"/>
<text class="f" x="490" y="1083">start-notebook.mjs</text>
<text class="r" x="498" y="1097.5">Start the notebook: node scripts/start-notebook.mjs [--port 8100], which</text>
<text class="r" x="498" y="1112">start-notebook.cmd, .ps1 and .sh call</text>
<line class="row" x1="490" x2="902" y1="1118.5" y2="1118.5"/>
<text class="f" x="490" y="1134.5">start.mjs</text>
<text class="r" x="498" y="1149">Start the editor: node scripts/start.mjs [--port 8000], which start.cmd, start.ps1</text>
<text class="r" x="498" y="1163.5">and start.sh call</text>
<line class="row" x1="490" x2="902" y1="1170" y2="1170"/>
<text class="f" x="490" y="1186">stop-notebook.mjs</text>
<text class="r" x="498" y="1200.5">Stop the notebook: node scripts/stop-notebook.mjs [--port 8100], which</text>
<text class="r" x="498" y="1215">stop-notebook.cmd, .ps1 and .sh call</text>
<line class="row" x1="490" x2="902" y1="1221.5" y2="1221.5"/>
<text class="f" x="490" y="1237.5">stop.mjs</text>
<text class="r" x="498" y="1252">Stop the editor: node scripts/stop.mjs [--port 8000], which stop.cmd, stop.ps1 and</text>
<text class="r" x="498" y="1266.5">stop.sh call</text>
</g>
</svg>
