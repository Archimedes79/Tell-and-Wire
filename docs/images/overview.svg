<svg xmlns="http://www.w3.org/2000/svg" width="900" height="732" viewBox="0 0 900 732" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Tell &amp; Wire: you design in the editor or the notebook, what you make is saved as plain files, and a deployment runs them</title>
<desc>Three bands from top to bottom. Design: two products, each with its own backend and both resting on common code -- the editor (a GUI editor and a graph editor, one editor backend) and the notebook (a page and its cells, one notebook backend); the common code holds the definitions of graph and GUI, authoring, host and runtime, and an AI that writes uses it. The project: one folder of plain files that both products write and that any text editor or git can read too -- the GUI (which also holds the notebook's page), the graph with its schedule, and one folder of files per node. Use: a browser shows the GUI, a session host keeps state and runs rounds, a language-specific execution engine runs the nodes and may ask an AI or a tool server. The editor and the notebook are two downloads.</desc>
<style>
  :root { --bg: #ffffff; --ink: #1f2937; --soft: #6b7280; --line: #9ca3af; --band: #f6f7f9; --ship-fill: #ccebe5; --ship-edge: #0f766e; --ship-ink: #064e3b; --deep-fill: #0f766e; --deep-ink: #ffffff; --note-fill: #fde9a8; --note-ink: #4a3b05; --ai-fill: #ddd0f2; --ai-edge: #6d3fb5; --ai-ink: #2e1065; --lang: #dbeafe; --edit-fill: #eceff3; --nb-fill: #dcebd8; --nb-edge: #4d7c4a; --nb-ink: #1f3b1d; --arrow: #3b6e8f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --ink: #e5e7eb; --soft: #9ca3af; --line: #4b5563; --band: #162033; --ship-fill: #134e4a; --ship-edge: #5eead4; --ship-ink: #ccfbf1; --deep-fill: #2dd4bf; --deep-ink: #042f2e; --note-fill: #5b4a12; --note-ink: #fef3c7; --ai-fill: #3b2766; --ai-edge: #b79cf0; --ai-ink: #ede9fe; --lang: #1e3a5f; --edit-fill: #1f2937; --nb-fill: #1f3a28; --nb-edge: #86b99a; --nb-ink: #d9f0df; --arrow: #7fb3d5; } }
  .bg { fill: var(--bg); }
  .band { fill: var(--band); stroke: var(--line); stroke-width: 0.6; }
  .editband { stroke-dasharray: 5 4; }
  .bl { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--soft); }
  .t { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .s { font-size: 12px; fill: var(--soft); }
  .box { fill: var(--ship-fill); stroke: var(--ship-edge); stroke-width: 0.8; }
  .deep { fill: var(--deep-fill); }
  .deep-t { font-size: 14px; font-weight: 600; fill: var(--deep-ink); }
  .box-t { font-size: 14px; font-weight: 600; fill: var(--ship-ink); }
  .box-s { font-size: 12px; fill: var(--ship-ink); }
  .note { fill: var(--note-fill); stroke: none; }
  .note-t { font-size: 13px; font-weight: 600; fill: var(--note-ink); }
  .note-s { font-size: 12px; fill: var(--note-ink); }
  .ai { fill: var(--ai-fill); stroke: var(--ai-edge); stroke-width: 0.8; }
  .ai-t { font-size: 14px; font-weight: 600; fill: var(--ai-ink); }
  .ai-s { font-size: 12px; fill: var(--ai-ink); }
  .edit { fill: var(--edit-fill); stroke: var(--soft); stroke-width: 0.8; stroke-dasharray: 4 3; }
  .nb { fill: var(--nb-fill); stroke: var(--nb-edge); stroke-width: 0.8; stroke-dasharray: 4 3; }
  .nb-t { font-size: 14px; font-weight: 600; fill: var(--nb-ink); }
  .nb-s { font-size: 12px; fill: var(--nb-ink); }
  .common { fill: var(--edit-fill); stroke: var(--soft); stroke-width: 1; }
  .lang { fill: var(--lang); stroke: none; }
  .arr { stroke: var(--arrow); stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .arr2 { stroke: var(--arrow); stroke-width: 1.6; fill: none; marker-end: url(#a); marker-start: url(#b); }
  .dash2 { stroke: var(--arrow); stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#a); marker-start: url(#b); }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="var(--arrow)"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="var(--arrow)"/></marker>
