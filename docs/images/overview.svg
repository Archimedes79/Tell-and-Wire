<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Tell &amp; Wire: you design a GUI and a graph in the editor, they are saved as plain files, and a deployment runs them</title>
<desc>Three bands from top to bottom. Design: the GUI editor and the graph editor talk to the editor backend, which uses an AI that writes. The project: a folder of plain files -- the GUI, the graph with its schedule, and one folder of files per node -- that any text editor or git can read too. Use: a browser shows the GUI, a session host keeps state and runs rounds, a language-specific execution engine runs the nodes and may ask an AI or a tool server.</desc>
<style>
  :root { --bg: #ffffff; --ink: #1f2937; --soft: #6b7280; --line: #9ca3af; --band: #f6f7f9; --ship-fill: #ccebe5; --ship-edge: #0f766e; --ship-ink: #064e3b; --deep-fill: #0f766e; --deep-ink: #ffffff; --note-fill: #fde9a8; --note-ink: #4a3b05; --ai-fill: #ddd0f2; --ai-edge: #6d3fb5; --ai-ink: #2e1065; --lang: #dbeafe; --edit-fill: #eceff3; --arrow: #3b6e8f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --ink: #e5e7eb; --soft: #9ca3af; --line: #4b5563; --band: #162033; --ship-fill: #134e4a; --ship-edge: #5eead4; --ship-ink: #ccfbf1; --deep-fill: #2dd4bf; --deep-ink: #042f2e; --note-fill: #5b4a12; --note-ink: #fef3c7; --ai-fill: #3b2766; --ai-edge: #b79cf0; --ai-ink: #ede9fe; --lang: #1e3a5f; --edit-fill: #1f2937; --arrow: #7fb3d5; } }
  .bg { fill: var(--bg); }
  .band { fill: var(--band); stroke: var(--line); stroke-width: 0.6; }
  .editband { stroke-dasharray: 5 4; }
  .bl { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--soft); }
  .t { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .s { font-size: 12px; fill: var(--soft); }
  .box { fill: var(--ship-fill); stroke: var(--ship-edge); stroke-width: 0.8; }
  .deep { fill: var(--deep-fill); }
  .deep-t { font-size: 14px; font-weight: 600; fill: var(--deep-ink); }
  .deep-s { font-size: 12px; fill: var(--deep-ink); }
  .box-t { font-size: 14px; font-weight: 600; fill: var(--ship-ink); }
  .box-s { font-size: 12px; fill: var(--ship-ink); }
  .note { fill: var(--note-fill); stroke: none; }
  .note-t { font-size: 13px; font-weight: 600; fill: var(--note-ink); }
  .note-s { font-size: 12px; fill: var(--note-ink); }
  .ai { fill: var(--ai-fill); stroke: var(--ai-edge); stroke-width: 0.8; }
  .ai-t { font-size: 14px; font-weight: 600; fill: var(--ai-ink); }
  .ai-s { font-size: 12px; fill: var(--ai-ink); }
  .edit { fill: var(--edit-fill); stroke: var(--soft); stroke-width: 0.8; stroke-dasharray: 4 3; }
  .lang { fill: var(--lang); stroke: none; }
  .arr { stroke: var(--arrow); stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .arr2 { stroke: var(--arrow); stroke-width: 1.6; fill: none; marker-end: url(#a); marker-start: url(#b); }
  .dash { stroke: var(--arrow); stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#a); }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="var(--arrow)"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9 z" fill="var(--arrow)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="610"/>

<!-- DESIGN -->
<rect class="band editband" x="20" y="16" width="860" height="190" rx="12"/>
<text class="bl" x="38" y="40">DESIGN  ·  the editor, in your browser</text>
<rect class="edit" x="60" y="56" width="170" height="56" rx="8"/>
<text class="t" x="145" y="80" text-anchor="middle">GUI editor</text>
<text class="s" x="145" y="98" text-anchor="middle">blocks in a browser page</text>
<rect class="edit" x="260" y="56" width="170" height="56" rx="8"/>
<text class="t" x="345" y="80" text-anchor="middle">Graph editor</text>
<text class="s" x="345" y="98" text-anchor="middle">nodes, wires, schedule</text>
<text class="s" x="470" y="78">Tell each node what it does.</text>
<text class="s" x="470" y="96">Wire the nodes. Lay out the GUI.</text>
<rect class="edit" x="60" y="146" width="600" height="44" rx="8"/>
<text class="t" x="360" y="173" text-anchor="middle">Editor backend  ·  reads and writes the project, checks it, runs it for you</text>
<rect class="ai" x="700" y="140" width="160" height="56" rx="8"/>
<text class="ai-t" x="780" y="164" text-anchor="middle">AI that writes</text>
<text class="ai-s" x="780" y="182" text-anchor="middle">local model or an API</text>
<path class="arr" d="M700 168 H662"/>
<text class="s" x="780" y="130" text-anchor="middle">writes code and prompts</text>
<path class="arr" d="M135 112 V146"/><path class="arr" d="M155 146 V112"/>
<path class="arr" d="M335 112 V146"/><path class="arr" d="M355 146 V112"/>

<!-- PROJECT -->
<rect class="band" x="20" y="226" width="860" height="136" rx="12"/>
<text class="bl" x="862" y="250" text-anchor="end">THE PROJECT  ·  plain files</text>
<rect class="note" x="60" y="264" width="170" height="82" rx="6"/>
<text class="note-t" x="145" y="288" text-anchor="middle">GUI</text>
<text class="note-s" x="145" y="308" text-anchor="middle">gui.json</text>
<text class="note-s" x="145" y="326" text-anchor="middle">blocks, tones, sizes</text>
<rect class="note" x="255" y="264" width="215" height="82" rx="6"/>
<text class="note-t" x="362" y="288" text-anchor="middle">Graph</text>
<text class="note-s" x="362" y="308" text-anchor="middle">graph-flow.json · graph-nodes.json</text>
<text class="note-s" x="362" y="326" text-anchor="middle">graph-schedule.json</text>
<rect class="note" x="495" y="264" width="200" height="82" rx="6"/>
<text class="note-t" x="595" y="288" text-anchor="middle">One folder per node</text>
<text class="note-s" x="595" y="308" text-anchor="middle">what it does · input.js · output.js</text>
<text class="note-s" x="595" y="326" text-anchor="middle">code.js  or  prompt.md</text>
<rect class="edit" x="720" y="264" width="140" height="82" rx="6"/>
<text class="t" x="790" y="294" text-anchor="middle">Your editor, git</text>
<text class="s" x="790" y="312" text-anchor="middle">read, change, diff</text>
<text class="s" x="790" y="328" text-anchor="middle">any file</text>
<path class="arr2" d="M696 305 H718"/>
<path class="arr2" d="M145 190 V264" transform="translate(0 0)"/>
<path class="arr2" d="M362 190 V264"/>
<path class="arr2" d="M595 190 V264"/>

<!-- USE -->
<rect class="band" x="20" y="382" width="860" height="212" rx="12"/>
<text class="bl" x="862" y="406" text-anchor="end">USE  ·  anywhere Node runs</text>
<rect class="lang" x="462" y="418" width="212" height="132" rx="10"/>
<rect class="box" x="60" y="436" width="150" height="76" rx="8"/>
<text class="box-t" x="135" y="466" text-anchor="middle">Browser</text>
<text class="box-s" x="135" y="486" text-anchor="middle">the GUI, as designed</text>
<rect class="box" x="250" y="436" width="170" height="76" rx="8"/>
<text class="box-t" x="335" y="466" text-anchor="middle">Session host</text>
<text class="box-s" x="335" y="486" text-anchor="middle">rounds, state, clock, HTTP</text>
<rect class="deep" x="486" y="436" width="164" height="76" rx="8"/>
<text class="deep-t" x="568" y="466" text-anchor="middle">Graph execution</text>
<text class="deep-t" x="568" y="484" text-anchor="middle">engine</text>
<rect class="ai" x="712" y="436" width="148" height="76" rx="8"/>
<text class="ai-t" x="786" y="466" text-anchor="middle">AI at run time</text>
<text class="ai-s" x="786" y="486" text-anchor="middle">a model, tool servers</text>
<path class="arr" d="M135 346 V436"/>
<path class="arr" d="M440 346 V398 H528 V436"/>
<path class="arr" d="M606 346 V436"/>
<text class="s" x="616" y="372">graph and node files, not the GUI</text>
<path class="arr" d="M212 458 H248"/>
<path class="arr" d="M248 490 H212"/>
<path class="arr" d="M422 458 H484"/>
<path class="arr" d="M484 490 H422"/>
<path class="arr2" d="M652 474 H710"/>
<text class="s" x="230" y="452" text-anchor="middle">use</text>
<text class="s" x="230" y="506" text-anchor="middle">shows</text>
<text class="s" x="453" y="452" text-anchor="middle">run</text>
<text class="s" x="453" y="506" text-anchor="middle">result</text>
<text class="s" x="568" y="532" text-anchor="middle" style="font-weight:600">language-specific</text>
<text class="s" x="568" y="546" text-anchor="middle">JavaScript today, open to more</text>
<text class="s" x="60" y="540">A block can also watch what a data node holds,</text>
<text class="s" x="60" y="556">with no round started.</text>
<rect x="40" y="572" width="12" height="12" rx="2" fill="var(--ship-fill)" stroke="var(--ship-edge)" stroke-width="0.8"/><text class="s" x="58" y="582">ships in a package</text>
<rect x="190" y="572" width="12" height="12" rx="2" fill="var(--edit-fill)" stroke="var(--soft)" stroke-dasharray="3 2"/><text class="s" x="208" y="582">only the editor</text>
<rect x="320" y="572" width="12" height="12" rx="2" fill="var(--note-fill)"/><text class="s" x="338" y="582">files</text>
<rect x="390" y="572" width="12" height="12" rx="2" fill="var(--ai-fill)" stroke="var(--ai-edge)" stroke-width="0.8"/><text class="s" x="408" y="582">a model</text>
</svg>
